name: Bug report
description: Report incorrect tracking, a crash or a build problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact command line (e.g. `vtt --input clip.mp4 --algo kcf --roi 10,20,64,48`).
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vtt --version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04, GCC 13, OpenCV 4.6
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / CSV excerpt
      render: text
